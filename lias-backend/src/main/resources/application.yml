spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/lias
    username: lias
    password: "${LIAS_DB_PASSWORD}"
  jpa:
    hibernate:
      ddl-auto: validate        # le schéma est géré par Flyway (db/migration), pas par Hibernate
    properties:
      hibernate:
        format_sql: true
        # Suffixe des tables d'audit générées par Envers
        envers:
          audit_table_suffix: _aud
          revision_field_name: rev
          revision_type_field_name: revtype
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

lias:
  security:
    jwt:
      secret: "${LIAS_JWT_SECRET}"
      access-token-ttl-minutes: 30
      invitation-ttl-hours: 72
  storage:
    root: ./storage          # racine de stockage des fichiers (hors base)
    max-file-size-mb: 20
    allowed-mime: ["application/pdf","image/png","image/jpeg"]

server:
  port: 8080
